server:
  port: 8083

spring:
  application:
    name: qp-alerts
  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:quantpulse}
    username: ${ALERTS_DB_USER:qp_alerts}
    password: ${ALERTS_DB_PASSWORD:qp_alerts_dev}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
      pool-name: qp-alerts-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: alerts
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    schemas: alerts
    default-schema: alerts
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:quantpulse}
    password: ${RABBITMQ_PASSWORD:qp_local_dev}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

quantpulse:
  alerts:
    dispatch-ms: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: qp-alerts

logging:
  level:
    com.quantpulse: INFO
